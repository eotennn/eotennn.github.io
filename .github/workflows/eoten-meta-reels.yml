name: EoTeN - Meta Reels (safeguarded)

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'

permissions:
  contents: write

concurrency:
  group: eoten-meta-reels
  cancel-in-progress: false

jobs:
  inspect-or-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect queue; publish only when explicitly enabled
        env:
          GH_TOKEN: ${{ github.token }}
          META_REELS_LIVE: ${{ vars.META_REELS_LIVE }}
          META_FB_REELS_LIVE: ${{ vars.META_FB_REELS_LIVE }}
          META_CUTOFF: ${{ vars.META_CUTOFF }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: 'v24.0'
          META_MAX_JOBS_PER_RUN: '1'
        run: |
          python3 -m py_compile .github/scripts/eoten_meta_reels.py
          python3 .github/scripts/eoten_meta_reels.py
