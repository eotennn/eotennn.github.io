name: EoTeN Shorts full frame blur 20261106
on:
  push:
    branches:
      - shorts-portrait-blur-20261106
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure ffmpeg is available
        run: ffmpeg -version | head -n 2
      - name: Install YouTube download tools
        run: |
          python3 -m pip install --user --upgrade "yt-dlp[default]"
          node --version
          python3 -m yt_dlp --version
      - name: Download original EoTeN YouTube video
        run: |
          python3 -m yt_dlp --verbose --no-playlist --force-ipv4 --js-runtimes node --remote-components ejs:github \
            -f "bv*+ba/b" --merge-output-format mp4 -o "source.%(ext)s" \
            "https://www.youtube.com/watch?v=UzGcX0cRfbg"
          INPUT_VIDEO="$(find . -maxdepth 1 -type f -name 'source.*' | head -n 1)"
          test -n "$INPUT_VIDEO"
          mv "$INPUT_VIDEO" source_media
          ffprobe -v error -show_entries format=duration:stream=width,height -of json source_media
      - name: Make 30-second chorus with full-frame center and blurred background
        run: |
          ffmpeg -hide_banner -y -ss 80 -i source_media -t 30 \
            -filter_complex "[0:v]split=2[bgsrc][fgsrc];[bgsrc]scale=360:640:force_original_aspect_ratio=increase,crop=360:640,boxblur=20:2,scale=1080:1920[bg];[fgsrc]scale=1080:-2[fg];[bg][fg]overlay=x=(W-w)/2:y=(H-h)/2:shortest=1,format=yuv420p[v]" \
            -map "[v]" -map 0:a:0 -c:v libx264 -preset veryfast -crf 20 -r 30 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart \
            "EoTeN_Seviyorsan_Incitme_Shorts_30s_Tam_Kadraj.mp4"
      - name: Verify size duration and streams
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of json \
            "EoTeN_Seviyorsan_Incitme_Shorts_30s_Tam_Kadraj.mp4"
      - name: Save the Shorts MP4 as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: EoTeN-Seviyorsan-Incitme-30s-Tam-Kadraj
          path: EoTeN_Seviyorsan_Incitme_Shorts_30s_Tam_Kadraj.mp4
          retention-days: 14
